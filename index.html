<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會議室預約看板</title>
<style>
  /* ===== 色彩與字型變數 ===== */
  :root {
    --bg: #e8ecee;
    --surface: #f7f9fa;
    --ink: #12222d;
    --muted: #5b6b76;
    --line: #cbd3d8;
    --danger: #b3261e;
    --room-A: #2b5f8e;
    --room-B: #2f7a5a;
    --room-C: #8b4a8f;
    --font: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    --row-h: 64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .page { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }

  /* ===== 頂部：日期與切換 ===== */
  .top {
    display: flex; flex-wrap: wrap; align-items: flex-end;
    justify-content: space-between; gap: 16px; margin-bottom: 20px;
  }
  .date-big { margin: 0; font-size: 2.5rem; font-weight: 700; line-height: 1.1; letter-spacing: 0.01em; }
  .date-sub { margin: 4px 0 0; color: var(--muted); }
  .nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    min-height: 44px; padding: 0 16px; border: 1px solid var(--ink);
    background: transparent; border-radius: 4px; cursor: pointer;
  }
  .btn:hover { background: var(--ink); color: var(--surface); }
  .btn-primary { background: var(--ink); color: var(--surface); }
  .btn-primary:hover { background: #2a4152; }
  /* 「今天」按鈕：琥珀黃實心，與三間會議室的顏色區隔 */
  .btn-today { background: #f2b134; border-color: #f2b134; color: var(--ink); font-weight: 700; }
  .btn-today:hover { background: #e09f1f; border-color: #e09f1f; color: var(--ink); }
  .nav input[type="date"] {
    min-height: 44px; padding: 0 10px; border: 1px solid var(--line);
    background: var(--surface); border-radius: 4px;
  }

  /* ===== 時間軸看板 ===== */
  .board-wrap { overflow-x: auto; }
  .board {
    display: grid;
    grid-template-columns: 56px repeat(3, minmax(120px, 1fr));
    grid-template-rows: 48px repeat(11, var(--row-h));
    background: var(--surface);
    border: 1px solid var(--line);
    min-width: 416px;
  }
  .room-head {
    display: flex; align-items: center; padding: 0 12px;
    color: #fff; font-weight: 700; border-left: 1px solid var(--surface);
  }
  .room-head[data-room="A"] { background: var(--room-A); }
  .room-head[data-room="B"] { background: var(--room-B); }
  .room-head[data-room="C"] { background: var(--room-C); }
  .corner { background: var(--surface); }

  .hour {
    padding: 6px 8px 0 0; text-align: right; color: var(--muted);
    font-size: 1.75rem; font-weight: 300; line-height: 1;
    font-variant-numeric: tabular-nums; border-top: 1px solid var(--line);
  }
  .cell {
    border: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line);
    background: transparent; cursor: pointer; color: transparent;
    font-size: 0.875rem; text-align: left; padding: 6px 10px;
  }
  .cell:hover, .cell:focus-visible { background: #e1e8ec; color: var(--muted); }

  /* 預約外框：左側為預約內容，右側（後方）為取消按鈕 */
  .booking-wrap { display: flex; margin: 2px; min-width: 0; }
  .booking-wrap .booking { margin: 0; flex: 1; min-width: 0; border-radius: 4px 0 0 4px; }
  .booking-wrap[data-room="A"] .cancel-btn { background: var(--room-A); }
  .booking-wrap[data-room="B"] .cancel-btn { background: var(--room-B); }
  .booking-wrap[data-room="C"] .cancel-btn { background: var(--room-C); }
  .cancel-btn {
    border: 0; border-left: 1px solid rgba(255, 255, 255, 0.5); border-radius: 0 4px 4px 0;
    padding: 0 8px; color: #fff; cursor: pointer; font-size: 0.875rem; font-weight: 700;
  }
  .cancel-btn:hover { background: var(--danger) !important; }
  .cancel-btn:focus-visible { outline-color: #fff; outline-offset: -4px; }

  .booking {
    margin: 2px; padding: 8px 10px; border: 0; border-radius: 4px; cursor: pointer;
    color: #fff; text-align: left; overflow: hidden;
    display: flex; flex-direction: column; gap: 2px;
  }
  .booking[data-room="A"] { background: var(--room-A); }
  .booking[data-room="B"] { background: var(--room-B); }
  .booking[data-room="C"] { background: var(--room-C); }
  .booking:hover { filter: brightness(1.12); }
  .booking .t { font-weight: 700; overflow-wrap: anywhere; }
  .booking .r { font-size: 0.875rem; opacity: 0.9; font-variant-numeric: tabular-nums; }

  /* ===== 對話框 ===== */
  dialog {
    width: min(420px, calc(100vw - 32px)); padding: 24px;
    border: 0; border-radius: 6px; background: var(--surface); color: var(--ink);
  }
  dialog::backdrop { background: rgba(18, 34, 45, 0.5); }
  dialog h2 { margin: 0 0 16px; font-size: 1.25rem; }
  .field { display: block; margin-bottom: 14px; }
  .field span { display: block; margin-bottom: 4px; font-size: 0.875rem; color: var(--muted); }
  .field input, .field select {
    width: 100%; min-height: 44px; padding: 0 10px;
    border: 1px solid var(--muted); border-radius: 4px; background: #fff;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .error { min-height: 1.5em; margin: 0 0 12px; color: var(--danger); font-weight: 700; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }

  @media (max-width: 520px) {
    .date-big { font-size: 2rem; }
    .hour { font-size: 1.25rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <div>
      <h1 class="date-big" id="dateBig"></h1>
      <p class="date-sub" id="dateSub"></p>
    </div>
    <div class="nav">
      <button class="btn" id="btnPrev" type="button">前一天</button>
      <button class="btn btn-today" id="btnToday" type="button">今天</button>
      <button class="btn" id="btnNext" type="button">後一天</button>
      <input type="date" id="datePicker" aria-label="選擇日期">
      <button class="btn" id="btnExport" type="button">匯出 CSV</button>
    </div>
  </header>

  <div class="board-wrap">
    <div class="board" id="board" role="grid" aria-label="會議室預約時間軸"></div>
  </div>
</main>

<dialog id="dlg">
  <form id="form" method="dialog" novalidate>
    <h2 id="dlgTitle"></h2>
    <label class="field"><span>會議主題</span>
      <input id="fTitle" type="text" maxlength="40" required autocomplete="off">
    </label>
    <label class="field"><span>會議室</span>
      <select id="fRoom"></select>
    </label>
    <label class="field"><span>日期</span>
      <input id="fDate" type="date" required>
    </label>
    <div class="row2">
      <label class="field"><span>開始時間</span><select id="fStart"></select></label>
      <label class="field"><span>結束時間</span><select id="fEnd"></select></label>
    </div>
    <p class="error" id="fError" role="alert"></p>
    <div class="actions">
      <button class="btn" type="button" id="btnCancel">取消</button>
      <button class="btn btn-primary" type="submit" id="btnSave">儲存</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  'use strict';

  // ===== 常數 =====
  var STORAGE_KEY = 'meeting-room-board:v1';
  var ROOMS = [
    { id: 'A', name: '會議室 A' },
    { id: 'B', name: '會議室 B' },
    { id: 'C', name: '會議室 C' }
  ];
  var START_HOUR = 8;  // 看板起始整點
  var END_HOUR = 19;   // 看板結束整點
  var WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];

  // ===== 資料層 =====
  var memoryFallback = '[]'; // localStorage 無法使用時的暫存

  function loadBookings() {
    var raw;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = memoryFallback; }
    if (!raw) return [];
    try {
      var data = JSON.parse(raw);
      return Array.isArray(data) ? data : [];
    } catch (e) {
      return [];
    }
  }

  function saveBookings(list) {
    var text = JSON.stringify(list);
    memoryFallback = text;
    try { localStorage.setItem(STORAGE_KEY, text); } catch (e) { /* 無法寫入時只保留於記憶體 */ }
  }

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // ===== 日期工具（一律使用本機時區）=====
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function toDateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseDate(s) {
    var p = s.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function addDays(s, n) {
    var d = parseDate(s);
    d.setDate(d.getDate() + n);
    return toDateStr(d);
  }
  function isValidDateStr(s) {
    return /^\d{4}-\d{2}-\d{2}$/.test(s) && toDateStr(parseDate(s)) === s;
  }
  function hourText(h) { return pad(h) + ':00'; }

  // ===== 驗證：回傳錯誤訊息，通過則回傳 null =====
  function validate(b, list) {
    if (!b.title.trim()) return '請輸入會議主題。';
    if (!isValidDateStr(b.date)) return '請選擇有效的日期。';
    if (!(b.startHour >= START_HOUR && b.endHour <= END_HOUR && b.startHour < b.endHour)) {
      return '結束時間必須晚於開始時間，且在 08:00 至 19:00 之間。';
    }
    for (var i = 0; i < list.length; i++) {
      var o = list[i];
      if (o.id === b.id) continue; // 修改時不與自己比對
      if (o.roomId === b.roomId && o.date === b.date &&
          o.startHour < b.endHour && b.startHour < o.endHour) {
        var room = ROOMS.filter(function (r) { return r.id === o.roomId; })[0];
        return room.name + ' 在 ' + hourText(o.startHour) + '–' + hourText(o.endHour) +
               ' 已有「' + o.title + '」，請改選其他時段。';
      }
    }
    return null;
  }

  // ===== 狀態 =====
  var bookings = loadBookings();
  var currentDate = toDateStr(new Date());

  // ===== 畫面元素 =====
  var $ = function (id) { return document.getElementById(id); };
  var board = $('board'), dlg = $('dlg'), form = $('form');
  var fTitle = $('fTitle'), fRoom = $('fRoom'), fDate = $('fDate');
  var fStart = $('fStart'), fEnd = $('fEnd'), fError = $('fError');
  var editingId = null; // null 表示新增

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function place(e, col, row, rowSpan) {
    e.style.gridColumn = col;
    e.style.gridRow = rowSpan ? row + ' / span ' + rowSpan : '' + row;
    return e;
  }

  // ===== 渲染看板 =====
  function render() {
    var d = parseDate(currentDate);
    $('dateBig').textContent = (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
    $('dateSub').textContent = d.getFullYear() + ' 年　星期' + WEEKDAYS[d.getDay()];
    $('datePicker').value = currentDate;

    board.textContent = '';
    board.appendChild(place(el('div', 'corner'), 1, 1));
    ROOMS.forEach(function (r, i) {
      var h = el('div', 'room-head', r.name);
      h.dataset.room = r.id;
      board.appendChild(place(h, i + 2, 1));
    });

    var today = bookings.filter(function (b) { return b.date === currentDate; });
    var occupied = {};
    today.forEach(function (b) {
      for (var h = b.startHour; h < b.endHour; h++) occupied[b.roomId + h] = true;
    });

    for (var h = START_HOUR; h < END_HOUR; h++) {
      var row = h - START_HOUR + 2;
      board.appendChild(place(el('div', 'hour', pad(h)), 1, row));
      ROOMS.forEach(function (r, i) {
        if (occupied[r.id + h]) return;
        var c = el('button', 'cell', '新增預約');
        c.type = 'button';
        c.setAttribute('aria-label', r.name + ' ' + hourText(h) + ' 新增預約');
        (function (roomId, hour) {
          c.addEventListener('click', function () { openDialog(null, { roomId: roomId, startHour: hour }); });
        })(r.id, h);
        board.appendChild(place(c, i + 2, row));
      });
    }

    today.forEach(function (b) {
      var ci = ROOMS.map(function (r) { return r.id; }).indexOf(b.roomId);
      var blk = el('button', 'booking');
      blk.type = 'button';
      blk.dataset.room = b.roomId;
      blk.appendChild(el('span', 't', b.title));
      blk.appendChild(el('span', 'r', hourText(b.startHour) + '–' + hourText(b.endHour)));
      blk.setAttribute('aria-label', '修改預約：' + b.title);
      blk.addEventListener('click', function () { openDialog(b); });
      var cancel = el('button', 'cancel-btn', '取消');
      cancel.type = 'button';
      cancel.setAttribute('aria-label', '取消預約：' + b.title);
      cancel.addEventListener('click', function () { cancelBooking(b); });
      var wrap = el('div', 'booking-wrap');
      wrap.dataset.room = b.roomId;
      wrap.appendChild(blk);
      wrap.appendChild(cancel);
      board.appendChild(place(wrap, ci + 2, b.startHour - START_HOUR + 2, b.endHour - b.startHour));
    });
  }

  // ===== 取消預約：確認後才刪除，並同步 localStorage =====
  function cancelBooking(b) {
    var room = ROOMS.filter(function (r) { return r.id === b.roomId; })[0];
    var msg = '確定要取消「' + b.title + '」嗎？\n' + room.name + '　' + b.date + '　' +
              hourText(b.startHour) + '–' + hourText(b.endHour) + '\n取消後無法復原。';
    if (!window.confirm(msg)) return;
    bookings = bookings.filter(function (o) { return o.id !== b.id; });
    saveBookings(bookings);
    render();
  }

  // ===== 對話框 =====
  function fillSelect(sel, items, selected) {
    sel.textContent = '';
    items.forEach(function (it) {
      var o = document.createElement('option');
      o.value = it.value; o.textContent = it.label;
      if (String(it.value) === String(selected)) o.selected = true;
      sel.appendChild(o);
    });
  }

  // 結束時間只列出比開始時間晚的整點
  function refreshEnd(keep) {
    var s = +fStart.value, items = [];
    for (var h = s + 1; h <= END_HOUR; h++) items.push({ value: h, label: hourText(h) });
    var want = keep != null && keep > s ? keep : s + 1;
    fillSelect(fEnd, items, want);
  }

  function openDialog(booking, preset) {
    editingId = booking ? booking.id : null;
    $('dlgTitle').textContent = booking ? '修改預約' : '新增預約';
    fError.textContent = '';

    var startItems = [];
    for (var h = START_HOUR; h < END_HOUR; h++) startItems.push({ value: h, label: hourText(h) });
    fillSelect(fRoom, ROOMS.map(function (r) { return { value: r.id, label: r.name }; }),
               booking ? booking.roomId : preset.roomId);
    fillSelect(fStart, startItems, booking ? booking.startHour : preset.startHour);
    refreshEnd(booking ? booking.endHour : null);
    fTitle.value = booking ? booking.title : '';
    fDate.value = booking ? booking.date : currentDate;
    dlg.showModal();
    fTitle.focus();
  }

  fStart.addEventListener('change', function () { refreshEnd(+fEnd.value); });
  $('btnCancel').addEventListener('click', function () { dlg.close(); });

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var b = {
      id: editingId || newId(),
      roomId: fRoom.value,
      date: fDate.value,
      startHour: +fStart.value,
      endHour: +fEnd.value,
      title: fTitle.value.trim()
    };
    var err = validate(b, bookings);
    if (err) { fError.textContent = err; return; }

    if (editingId) {
      bookings = bookings.map(function (o) { return o.id === editingId ? b : o; });
    } else {
      bookings.push(b);
    }
    saveBookings(bookings);
    dlg.close();
    render();
  });

  // ===== 日期切換 =====
  $('btnPrev').addEventListener('click', function () { currentDate = addDays(currentDate, -1); render(); });
  $('btnNext').addEventListener('click', function () { currentDate = addDays(currentDate, 1); render(); });
  $('btnToday').addEventListener('click', function () { currentDate = toDateStr(new Date()); render(); });
  $('datePicker').addEventListener('change', function (e) {
    if (isValidDateStr(e.target.value)) { currentDate = e.target.value; render(); }
  });

  // ===== 匯出 CSV（匯出全部預約，不影響資料）=====
  function csvCell(v) {
    var s = String(v);
    if (/^[=+\-@]/.test(s)) s = "'" + s; // 避免在試算表中被當成公式
    return '"' + s.replace(/"/g, '""') + '"';
  }

  function exportCsv() {
    var rows = [['日期', '會議室', '開始時間', '結束時間', '主題']];
    bookings.slice().sort(function (a, b) {
      return a.date < b.date ? -1 : a.date > b.date ? 1 :
        a.roomId < b.roomId ? -1 : a.roomId > b.roomId ? 1 : a.startHour - b.startHour;
    }).forEach(function (b) {
      var room = ROOMS.filter(function (r) { return r.id === b.roomId; })[0];
      rows.push([b.date, room ? room.name : b.roomId, hourText(b.startHour), hourText(b.endHour), b.title]);
    });
    var text = rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
    // 加上 BOM，讓 Excel 正確辨識 UTF-8 中文
    var blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'bookings-' + toDateStr(new Date()) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  $('btnExport').addEventListener('click', exportCsv);

  render();
})();
</script>
</body>
</html>
